{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 12px;">
    <h2 style="color: var(--primary-color); margin-bottom: 10px;">Forgot Password?</h2>
    <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">
        Enter your email address and we'll send you a link to reset your password.
    </p>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight: 600; color: var(--text-main);">Email Address</label>
            <input type="email" name="email" required 
                   style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); outline: none;">
        </div>
        <button type="submit" style="width: 100%; background: var(--primary-color); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
