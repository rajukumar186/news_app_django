{% extends 'base.html' %}
{% block title %}{{ action }} {{ model_name }} | Control Center{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
    <!-- Header Section -->
    <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
        <a href="{% url 'dynamic_model_list' model_name %}" style="color: var(--primary-color); font-size: 0.8rem; text-decoration: none; font-weight: 600;">
            <i class="fa-solid fa-arrow-left"></i> Back to List
        </a>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-top: 4px; text-transform: capitalize; color: var(--text-main);">
            {{ action }} Record: {{ model_name }}
        </h1>
    </div>

    <!-- Form Card Container -->
    <div class="card" style="padding: 30px;">
        <form method="POST" enctype="multipart/form-data" class="form-container" style="display: flex; flex-direction: column; gap: 16px;">
            {% csrf_token %}
            
            {{ form.as_p }}

            <!-- Action Buttons -->
            <div style="padding-top: 16px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border-color); margin-top: 10px;">
                <a href="{% url 'dynamic_model_list' model_name %}" style="background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;">
                    Cancel
                </a>
                <button type="submit" style="background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">
                    Save Record
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    /* Styling Django form elements generated via as_p to match app theme */
    .form-container p {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .form-container label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
    }
    /* Target links inside form (like current file upload paths) */
    .form-container a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
    }
    .form-container a:hover {
        text-decoration: underline;
    }
    .form-container input[type="text"],
    .form-container input[type="email"],
    .form-container input[type="password"],
    .form-container input[type="url"],
    .form-container input[type="number"],
    .form-container select,
    .form-container textarea {
        width: 100%;
        background-color: var(--bg-color);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
    }
    .form-container input[type="text"]:focus,
    .form-container input[type="email"]:focus,
    .form-container input[type="password"]:focus,
    .form-container input[type="url"]:focus,
    .form-container input[type="number"]:focus,
    .form-container select:focus,
    .form-container textarea:focus {
        border-color: var(--primary-color);
    }
    .form-container input[type="checkbox"] {
        accent-color: var(--primary-color);
        width: 16px;
        height: 16px;
        margin-right: 6px;
    }
    .form-container input[type="file"] {
        color: var(--text-muted);
        font-size: 0.85rem;
    }
    .form-container .helptext {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: -2px;
    }
    .form-container ul.errorlist {
        list-style: none;
        color: #e74c3c;
        font-size: 0.8rem;
        font-weight: 600;
    }
</style>
{% endblock %}
