{% extends 'base.html' %}

{% block extra_css %}
<style>
    :root {
        --weather-glass: rgba(255, 255, 255, 0.1);
        --weather-border: rgba(255, 255, 255, 0.2);
        --weather-accent: #00d2ff;
        --weather-gradient: linear-gradient(to right, #00d2ff, #3a7bd5);
    }

    body.dark-mode .weather-dashboard {
        --weather-glass: rgba(255, 255, 255, 0.05);
        --text-main: #ffffff;
    }

    .weather-dashboard {
        padding: 15px; /* Reduced padding for mobile */
        color: var(--text-main);
        max-width: 1200px;
        margin: 0 auto;
    }

    /* --- Search Section --- */
    .search-row {
        margin-bottom: 25px;
        display: flex;
        justify-content: center;
    }

    .weather-search-bar {
        display: flex;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 5px;
        width: 100%;
        max-width: auto;
        box-shadow: 0 4px 15px var(--shadow);
    }

    .weather-search-bar input {
        background: transparent;
        border: none;
        color: inherit;
        padding: 10px 15px;
        flex: 1; /* Ensures input takes available space */
        min-width: 0; /* Prevents overflow in flexbox */
        outline: none;
    }

    .weather-search-bar button {
        background: var(--primary-color);
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        white-space: nowrap;
    }

    /* --- Main Dashboard Grid --- */
    .main-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }

    .glass-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 30px;
        text-align: center; /* Better look on mobile */
        box-shadow: 0 4px 15px var(--shadow);
    }

    .current-temp-big {
        font-size: clamp(3.5rem, 10vw, 5rem); /* Responsive font size */
        font-weight: 800;
        margin: 10px 0;
        color: var(--primary-color);
    }

    .stats-sidebar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .stat-item {
        background: var(--card-bg);
        padding: 15px;
        border-radius: 16px;
        text-align: center;
        border: 1px solid var(--border-color);
    }

    /* --- Forecast Slider --- */
    .forecast-section {
        margin-top: 20px;
    }

    .forecast-slider {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 10px 5px 20px 5px;
        scrollbar-width: thin; /* Firefox */
        -webkit-overflow-scrolling: touch; /* Smooth scroll for iOS */
    }

    /* Custom Scrollbar for Chrome/Safari */
    .forecast-slider::-webkit-scrollbar {
        height: 6px;
    }
    .forecast-slider::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 10px;
    }

    .day-card {
        min-width: 110px; /* Slimmer cards to see more at once */
        flex: 0 0 auto;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 15px;
        text-align: center;
        transition: transform 0.2s;
    }

    /* --- Responsive Breakpoints --- */
    @media (max-width: 992px) {
        .main-grid { 
            grid-template-columns: 1fr; 
        }
    }

    @media (max-width: 480px) {
        .stats-sidebar {
            grid-template-columns: repeat(2, 1fr); /* Keep 2x2 for small phones */
        }
        
        .glass-card {
            padding: 20px;
        }

        .weather-search-bar button {
            padding: 10px 15px;
            font-size: 0.9rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="weather-dashboard">
    <div class="search-row">
        <div class="weather-search-bar">
            <input type="text" placeholder="Search city..." id="city-input">
            <button onclick="getWeather()">Search</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="glass-card">
            <h2 id="city-name">New Delhi</h2>
            <p id="date-today">Wednesday, 15 April</p>
            <div class="current-temp-big">28°C</div>
            <p>Sunny Skies</p>
        </div>

        <div class="stats-sidebar">
            <div class="stat-item">
                <small>HUMIDITY</small>
                <div>45%</div>
            </div>
            <div class="stat-item">
                <small>WIND</small>
                <div>12 km/h</div>
            </div>
            <div class="stat-item">
                <small>UV INDEX</small>
                <div>High</div>
            </div>
            <div class="stat-item">
                <small>PRESSURE</small>
                <div>1012 hPa</div>
            </div>
        </div>
    </div>

    <div class="forecast-section">
        <h3 class="sidebar-title">7-Day Forecast</h3>
        <div class="forecast-slider">
            <div class="day-card">
                <h4>Thu</h4>
                <div style="font-size: 1.5rem;">☀️</div>
                <strong>30°C</strong>
            </div>
            <div class="day-card">
                <h4>Fri</h4>
                <div style="font-size: 1.5rem;">⛅</div>
                <strong>29°C</strong>
            </div>
           
              
            </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function getWeather() {
        const city = document.getElementById('city-input').value;
        console.log("Searching for weather in: " + city);
        // Add your Weather API logic here
    }
</script>
{% endblock %}
