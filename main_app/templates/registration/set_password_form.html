{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 40px auto; border-radius: 12px;">
    
    <h2 style="margin-top: 0; color: var(--primary-color);">Set Your Password</h2>
    <p style="margin-bottom: 25px; color: var(--text-muted); font-size: 0.95rem;">
        Almost there! Choose a secure password to activate your account for The People's Era.
    </p>
    
    {% if error %}
        <p style="color: #c0392b; font-size: 14px; background: rgba(192, 57, 43, 0.1); padding: 12px; border-radius: 8px; border: 1px solid var(--primary-color); margin-bottom: 20px;">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </p>
    {% endif %}

    <form method="POST" id="passwordForm">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight: 600; color: var(--text-main);">
                New Password
            </label>
            <input type="password" name="password" id="pass1" required 
                   style="width: 100%; padding: 12px; border-radius: 8px; 
                          border: 1px solid var(--border-color); 
                          background-color: var(--bg-color); 
                          color: var(--text-main);
                          outline: none; transition: border-color 0.2s;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display:block; margin-bottom:8px; font-weight: 600; color: var(--text-main);">
                Confirm Password
            </label>
            <input type="password" name="confirm_password" id="pass2" required 
                   style="width: 100%; padding: 12px; border-radius: 8px; 
                          border: 1px solid var(--border-color); 
                          background-color: var(--bg-color); 
                          color: var(--text-main);
                          outline: none; transition: border-color 0.2s;">
            
            <span id="message" style="font-size: 12px; margin-top: 8px; display: block; font-weight: 600;"></span>
        </div>
        
        <button type="submit" id="submitBtn"
                style="width: 100%; background: var(--primary-color); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: transform 0.1s, opacity 0.2s;">
            Activate Account
        </button>
    </form>
</div>

<script>
    const pass1 = document.getElementById('pass1');
    const pass2 = document.getElementById('pass2');
    const message = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    function validate() {
        if (!pass1.value || !pass2.value) {
            message.innerHTML = "";
            return;
        }

        if (pass1.value === pass2.value) {
            message.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match';
            message.style.color = "#27ae60"; // A nice green
            btn.disabled = false;
            btn.style.opacity = "1";
            btn.style.cursor = "pointer";
        } else {
            message.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match';
            message.style.color = "#c0392b"; // Your primary red
            btn.disabled = true;
            btn.style.opacity = "0.6";
            btn.style.cursor = "not-allowed";
        }
    }

    pass1.addEventListener('input', validate);
    pass2.addEventListener('input', validate);
</script>
{% endblock %}
