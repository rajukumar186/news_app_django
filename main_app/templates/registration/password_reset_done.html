{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 60px auto; padding: 40px; text-align: center;">
    <div style="font-size: 50px; color: var(--primary-color); margin-bottom: 20px;">
        <i class="fas fa-paper-plane"></i>
    </div>
    <h2 style="color: var(--text-main);">Email Sent!</h2>
    <p style="color: var(--text-muted); margin-top: 15px; line-height: 1.6;">
        If an account exists with <strong>{{ email }}</strong>, you will receive a password reset link shortly.
    </p>
    <div style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <a href="{% url 'login' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 800;">
            &larr; Back to Login
        </a>
    </div>
</div>
{% endblock %}
